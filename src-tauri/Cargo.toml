[package]
name = "openpycharm"
version = "0.2.0"
description = "An open-source Python IDE inspired by JetBrains PyCharm"
authors = ["OpenPyCharm contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "openpycharm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# tauri build 会自动启用；直接用 cargo 编译 release 时必须显式开启，
# 否则窗口会去连 devUrl（localhost:1420）而不是内嵌的前端资源。
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
regex = "1"
portable-pty = "0.8"
base64 = "0.22"
notify = "7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
mysql = "26"
postgres = "0.19"

[profile.release]
codegen-units = 1
lto = true
strip = true
